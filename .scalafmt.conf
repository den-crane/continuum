version = 3.8.3
runner.dialect = scala213source3

maxColumn = 100

# Keep the existing style: no vertical alignment churn beyond the basics
align.preset = some

rewrite.rules = [SortModifiers]

# Cross-built sources: avoid rewrites that are 2.13- or 3-specific
newlines.beforeCurlyLambdaParams = never
docstrings.style = Asterisk
docstrings.wrap = no
